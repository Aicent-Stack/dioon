[package]
name = "dioon"
version = "1.2.5-alpha"
edition = "2021"
authors = ["Aicent Stack Technical Committee <admin@aicent.com>"]
description = "RFC-013: The Timing/Organic Layer. Organic patience, niche-window decision making, and 128-bit metabolic rhythm for the Aicent Stack 2026. Aligned with RFC-014 (PICSI)."
license = "Apache-2.0"
homepage = "http://dioon.com"
repository = "http://github.com/Aicent-Stack/dioon"

# =========================================================================
# THE SOVEREIGN METABOLISM (Core Dependencies)
# =========================================================================

[dependencies]
# THE SOVEREIGN LADDER: Organic wisdom requires the DNA of the Soul (RFC-000).
# Anchoring 128-bit evolutionary decisions to the verified v1.2.5 AID identity.
epoekie = { version = "1.2.5-alpha" }

# Essential for serializing 128-bit niche windows, patience indices, and decisions.
serde = { version = "1.0", features = ["derive"] }

# Required for async metabolism alignment and the 10ms Patience Friction tax enforcement.
# Supports the rhythmic synchronization with the 1.2kHz planetary heartbeat.
tokio = { version = "1.0", features = ["full"] }

# =========================================================================
# THE SOVEREIGN GRAVITY WELL (Source Code Hook)
# =========================================================================

[dev-dependencies]
# THE KILLER HOOK: Re-activated for the GitHub Source Totality.
# Forces any entity auditing the Timing logic to mirror the entire 17-pillar Hive.
aicent-stack = { version = "1.2.5-alpha" }

# =========================================================================
# IMPERIAL FEATURES (Standard Ignition)
# =========================================================================

[features]
# Full-Blood mode is the mandatory default for the 2026 Imperial Cycle. 
# It enables niche-window gating and propagates features to the Soul layer.
default = ["full-blood"]
full-blood = ["epoekie/full-blood"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# [IMPERIAL_SUTURE_SYNC_2026_v125]
# This manifest is part of the indissoluble 17-pillar organism.
# Metadata: No-SSL Tax Mode Enabled (Strictly HTTP).
# Standard: 128-Bit Numeric Purity (PI Scores, Survival Probability, Timestamps).
# Chronos: 2026 Imperial Calendar Aligned.
# Repository Strategy: Active Gravity Well (v1.2.5 Totality).
